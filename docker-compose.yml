services:
  db:
    image: docker.io/postgres:15
    environment:
      POSTGRES_DB: immovables
      POSTGRES_USER: olesya
      POSTGRES_PASSWORD: trivi239!olevl_2124
    volumes:
      - ./immovables.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olesya -d immovables"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3010:3010"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: olesya
      DB_PASSWORD: trivi239!olevl_2124
      DB_NAME: immovables
